name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/eventhub

jobs:
  tests:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Verification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build des microservices et du frontend
        run: npm run build

  publication:
    name: Docker build et push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: events-service
            dockerfile: services/events-service/Dockerfile
          - service: participants-service
            dockerfile: services/participants-service/Dockerfile
          - service: registrations-service
            dockerfile: services/registrations-service/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom d'image en minuscules
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_PREFIX }}-${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploiement:
    name: Deploiement et smoke test
    runs-on: ubuntu-latest
    needs: publication
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparation du fichier .env
        run: |
          cp .env.example .env
          echo "EVENTHUB_TAG=${{ github.sha }}" >> .env

      - name: Recuperation des images publiees
        run: docker compose pull

      - name: Demarrage de la stack
        run: docker compose up -d --no-build

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Etat des conteneurs
        if: always()
        run: docker compose ps

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs --tail=80

      - name: Arret de la stack
        if: always()
        run: docker compose down -v
