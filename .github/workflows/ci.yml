name: CI

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Verification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build des microservices et du frontend
        run: npm run build

  images:
    name: Build Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: events-service
            dockerfile: services/events-service/Dockerfile
          - service: participants-service
            dockerfile: services/participants-service/Dockerfile
          - service: registrations-service
            dockerfile: services/registrations-service/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: eventhub-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
