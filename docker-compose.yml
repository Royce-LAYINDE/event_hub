name: eventhub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventhub} -d ${POSTGRES_DB:-eventhub}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [eventhub]

  events-service:
    build:
      context: .
      dockerfile: services/events-service/Dockerfile
    image: ghcr.io/royce-layinde/eventhub-events-service:${EVENTHUB_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventhub}:${POSTGRES_PASSWORD:-eventhub}@postgres:5432/eventhub_events
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${EVENTS_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [eventhub]

  participants-service:
    build:
      context: .
      dockerfile: services/participants-service/Dockerfile
    image: ghcr.io/royce-layinde/eventhub-participants-service:${EVENTHUB_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventhub}:${POSTGRES_PASSWORD:-eventhub}@postgres:5432/eventhub_participants
      PORT: 3002
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "${PARTICIPANTS_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [eventhub]

  registrations-service:
    build:
      context: .
      dockerfile: services/registrations-service/Dockerfile
    image: ghcr.io/royce-layinde/eventhub-registrations-service:${EVENTHUB_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventhub}:${POSTGRES_PASSWORD:-eventhub}@postgres:5432/eventhub_registrations
      PORT: 3003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      EVENTS_SERVICE_URL: http://events-service:3001
      PARTICIPANTS_SERVICE_URL: http://participants-service:3002
    ports:
      - "${REGISTRATIONS_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      events-service:
        condition: service_healthy
      participants-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks: [eventhub]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/royce-layinde/eventhub-frontend:${EVENTHUB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      events-service:
        condition: service_healthy
      participants-service:
        condition: service_healthy
      registrations-service:
        condition: service_healthy
    networks: [eventhub]

volumes:
  postgres-data:

networks:
  eventhub:
    driver: bridge
